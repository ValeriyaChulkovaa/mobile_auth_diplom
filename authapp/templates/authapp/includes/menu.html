<style>
    .sidebar {
        min-height: 100vh; /* Минимальная высота боковой панели */
    }

    /* Убираем лишний отступ вокруг hr, если он нужен */
    .sidebar hr {
        margin: 0; /* Убираем отступы сверху и снизу */
        border: none; /* Убираем линию */
        border-top: 1px solid rgba(0, 0, 0, 0.1); /* Если линия все же нужна, делаем ее менее заметной */
    }
</style>

<div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
    <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu"
         aria-labelledby="sidebarMenuLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarMenuLabel">Сервис авторизации</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"
                    aria-label="Close"></button>
        </div>

        <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
            <ul class="nav flex-column">

                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center gap-2" aria-current="page" href="{% url 'authapp:index' %}">
                        <svg class="bi">
                            <use xlink:href="/static/svg/icons-menu.svg#house-fill"/>
                        </svg>
                        Главная
                    </a>
                </li>

                <!-- Убираем или корректируем hr -->
                <hr class="my-0"> <!-- Если нужно оставить линию, но без отступов -->

                {% endif %}

                <ul class="nav flex-column mb-auto">

                    {% if user.is_superuser %}
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="{% url 'authapp:users_list' %}">
                            <svg class="bi">
                                <use xlink:href="/static/svg/icons-menu.svg#people"/>
                            </svg>
                            Пользователи системы
                        </a>
                    </li>
                    {% endif %}

                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <form method="post" action="{% url 'authapp:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="nav-link d-flex align-items-center gap-2">
                            <svg class="bi">
                                <use xlink:href="/static/svg/icons-menu.svg#door-closed"/>
                            </svg>
                            Выход
                        </button>
                        </form>
                    </li>

                    {% else %}

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="{% url 'authapp:phone_login' %}">
                            <svg class="bi">
                                <use xlink:href="/static/svg/icons-menu.svg#door-open"/>
                            </svg>
                            Войти по телефону
                        </a>
                    </li>

                    {% endif %}

                </ul>
            </ul>
        </div>
    </div>
</div>
